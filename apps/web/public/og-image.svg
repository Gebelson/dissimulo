<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Deep Noir Background -->
  <rect width="1200" height="630" fill="#0C0B0A" />

  <!-- Background Manor Silhouette Horizon -->
  <path d="M 0 460 Q 300 440 600 450 T 1200 460 L 1200 630 L 0 630 Z" fill="#14110E" />
  <path d="M 520 450 L 520 340 L 560 300 L 600 270 L 640 300 L 680 340 L 680 450 Z" fill="#1A1613" />
  <rect x="585" y="320" width="30" height="40" rx="4" fill="#B79A70" opacity="0.35" />

  <!-- Ambient Light -->
  <circle cx="600" cy="220" r="240" fill="#B79A70" fill-opacity="0.05" />
  <circle cx="750" cy="300" r="160" fill="#9F3D3D" fill-opacity="0.05" />

  <!-- Wax Seal & Antique Brass Medallion -->
  <g transform="translate(540, 80) scale(3.8)">
    <circle cx="16" cy="16" r="14" fill="#241113" stroke="#B79A70" stroke-width="1.5" />
    <circle cx="16" cy="16" r="12" stroke="#9F3D3D" stroke-width="0.8" />
    <text x="16" y="21" font-family="'Georgia', serif" font-weight="700" font-style="italic" font-size="16" fill="#F2EDE4" text-anchor="middle">D</text>
    <circle cx="23" cy="9" r="2.2" fill="#9F3D3D" />
  </g>

  <!-- Typography -->
  <text x="600" y="360" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="76" letter-spacing="16" fill="#F2EDE4">DISSIMULO</text>
  <text x="600" y="415" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="20" letter-spacing="8" fill="#B79A70">THRILLER DE INVESTIGAÇÃO &amp; DEDUÇÃO SOCIAL</text>
  <text x="600" y="475" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="26" fill="#C2B7AA">"Ninguém tem a história inteira."</text>

  <!-- Corner Brackets -->
  <path d="M 40 80 L 40 40 L 80 40" stroke="#B79A70" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 1120 40 L 1160 40 L 1160 80" stroke="#B79A70" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 40 550 L 40 590 L 80 590" stroke="#B79A70" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 1120 590 L 1160 590 L 1160 550" stroke="#B79A70" stroke-width="2.5" fill="none" opacity="0.5"/>
