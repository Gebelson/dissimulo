<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#070B12" />
  
  <!-- Subtle Grid / Scanlines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F1724" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="280" r="300" fill="#00F0FF" fill-opacity="0.04" filter="blur(60px)" />
  <circle cx="850" cy="240" r="180" fill="#FF2A55" fill-opacity="0.04" filter="blur(50px)" />

  <!-- Stylized Forensic D Monogram Icon -->
  <g transform="translate(536, 120) scale(4)">
    <rect width="32" height="32" rx="8" fill="#0F1724" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M8 6v20" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="10" x2="8" y2="10" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="4" y1="16" x2="8" y2="16" stroke="#FF2A55" stroke-width="2" />
    <line x1="5" y1="22" x2="8" y2="22" stroke="#00F0FF" stroke-width="1.5" />
    <path d="M8 6h7.5a10 10 0 0 1 10 10v0a10 10 0 0 1-10 10H8" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
    <path d="M11 11h4a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5h-4" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round" />
    <circle cx="16" cy="16" r="1.8" fill="#FF2A55" />
    <line x1="24" y1="16" x2="28" y2="16" stroke="#FF2A55" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="600" y="360" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="76" letter-spacing="8" fill="#F8FAFC">DISSIMULO</text>
  <text x="600" y="415" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="20" letter-spacing="6" fill="#00F0FF">PERÍCIA FORENSE &amp; DEDUÇÃO SOCIAL</text>
  <text x="600" y="475" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-size="24" fill="#94A3B8">"Ninguém tem a história inteira."</text>

  <!-- Corner Brackets -->
  <path d="M 40 80 L 40 40 L 80 40" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 1120 40 L 1160 40 L 1160 80" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 40 550 L 40 590 L 80 590" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 1120 590 L 1160 590 L 1160 550" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.6"/>
</svg>
