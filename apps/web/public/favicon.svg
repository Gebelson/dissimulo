<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Sepia Background -->
  <rect width="32" height="32" rx="8" fill="#0C0B0A" />
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="#4A3A32" stroke-width="1.5" />
  
  <!-- Antique Brass Medallion Rim -->
  <circle cx="16" cy="16" r="12" fill="#1C1814" stroke="#B79A70" stroke-width="1.5" />
  <circle cx="16" cy="16" r="10" stroke="#9F3D3D" stroke-opacity="0.5" stroke-width="0.8" />

  <!-- Serif D in Warm Ivory -->
  <text x="16" y="21" font-family="'Cormorant Garamond', 'Georgia', serif" font-weight="700" font-style="italic" font-size="16" fill="#F2EDE4" text-anchor="middle">D</text>

  <!-- Crimson Wax Accent Dot -->
  <circle cx="23" cy="9" r="2" fill="#9F3D3D" />
</svg>
